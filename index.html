<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NKS Messenger</title>
  <style>
    :root {
      --bg-main: #111b21;
      --bg-side: #111b21;
      --bg-header: #202c33;
      --bg-chat: #0b141a;
      --accent: #00a884;
      --text: #e9edef;
      --text-muted: #8696a0;
      --msg-sent: #005c4b;
      --msg-recv: #202c33;
      --border: #222d34;
      --icon-color: #aebac1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg-main); color: var(--text); }

    /* SVG Icon Universal Styling */
    svg.icon {
      width: 22px !important;
      height: 22px !important;
      stroke: var(--icon-color) !important;
      stroke-width: 2 !important;
      fill: none !important;
      stroke-linecap: round !important;
      stroke-linejoin: round !important;
      display: inline-block !important;
      flex-shrink: 0;
      cursor: pointer;
    }

    /* AUTH SCREEN */
    .auth-screen {
      position: fixed; inset: 0; background: var(--bg-main); z-index: 1000;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .auth-screen.hidden { display: none; }
    .auth-card {
      background: var(--bg-header); border-radius: 16px; padding: 28px;
      width: 100%; max-width: 380px; border: 1px solid var(--border); text-align: center;
    }
    .auth-logo { width: 60px; height: 60px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
    .auth-logo svg.icon { stroke: #fff !important; width: 32px !important; height: 32px !important; }
    .auth-title { font-size: 1.5rem; margin-bottom: 20px; font-weight: 700; color: #fff; }
    .auth-inputs { display: flex; flex-direction: column; gap: 12px; }
    .auth-input { padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-main); color: var(--text); font-size: 0.95rem; outline: none; }
    .auth-btn { padding: 12px; border-radius: 8px; border: none; background: var(--accent); color: #111; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 8px; }

    /* APP LAYOUT */
    .app-root { display: flex; width: 100%; height: 100vh; position: relative; }
    .app-root.hidden { display: none; }

    /* LEFT SIDEBAR */
    .sidebar {
      width: 30%; min-width: 320px; height: 100%; display: flex; flex-direction: column;
      background: var(--bg-side); border-right: 1px solid var(--border);
    }

    .top-header {
      height: 60px; background: var(--bg-header); display: flex;
      align-items: center; justify-content: space-between; padding: 0 16px;
      border-bottom: 1px solid var(--border);
    }
    .brand-title { font-size: 1.3rem; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
    .header-actions { display: flex; gap: 16px; align-items: center; }

    .search-box { padding: 8px 12px; background: var(--bg-side); border-bottom: 1px solid var(--border); }
    .search-input-wrap {
      background: var(--bg-header); border-radius: 8px; display: flex; align-items: center; padding: 6px 12px; gap: 10px;
    }
    .search-input-wrap input { background: none; border: none; color: var(--text); outline: none; width: 100%; font-size: 0.9rem; }

    .chat-list { flex: 1; overflow-y: auto; }
    .chat-row { display: flex; align-items: center; padding: 12px 16px; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.03); cursor: pointer; }
    .chat-row:hover, .chat-row.active { background: var(--bg-header); }

    .user-avatar { width: 44px; height: 44px; border-radius: 50%; background: #374248; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    .chat-details { flex: 1; min-width: 0; }
    .chat-header-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .chat-username { font-weight: 600; font-size: 0.95rem; }
    .chat-timestamp { font-size: 0.75rem; color: var(--text-muted); }
    .chat-last-message { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* RIGHT CHAT CONTAINER */
    .chat-panel { flex: 1; height: 100%; display: flex; flex-direction: column; background: var(--bg-chat); }
    .chat-panel.empty { display: flex; align-items: center; justify-content: center; color: var(--text-muted); text-align: center; }

    .active-chat-header {
      height: 60px; background: var(--bg-header); display: flex;
      align-items: center; padding: 0 16px; gap: 12px; border-bottom: 1px solid var(--border);
    }
    .header-user-info { flex: 1; }
    .header-user-name { font-weight: 600; font-size: 1rem; }
    .header-user-status { font-size: 0.75rem; color: var(--accent); }

    .chat-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }

    .msg-bubble { max-width: 65%; padding: 8px 12px; border-radius: 8px; font-size: 0.95rem; word-break: break-word; line-height: 1.4; position: relative; }
    .msg-bubble.sent { align-self: flex-end; background: var(--msg-sent); }
    .msg-bubble.received { align-self: flex-start; background: var(--msg-recv); }

    .msg-footer { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 2px; }
    .msg-time { font-size: 0.65rem; color: rgba(255,255,255,0.6); }

    .chat-input-bar { height: 62px; background: var(--bg-header); display: flex; align-items: center; padding: 0 16px; gap: 12px; }
    .message-input { flex: 1; background: var(--bg-main); border: none; padding: 12px 16px; border-radius: 20px; color: var(--text); outline: none; font-size: 0.95rem; }

    /* MODAL OVERLAY */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal-content { background: var(--bg-header); border-radius: 12px; padding: 20px; width: 100%; max-width: 350px; border: 1px solid var(--border); }
    .modal-title { font-size: 1.1rem; margin-bottom: 12px; font-weight: 600; }
    .modal-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .btn-secondary { background: var(--bg-main); color: var(--text); border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    .btn-primary { background: var(--accent); color: #111; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">
      <svg class="icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
    </div>
    <h2 class="auth-title">NKS Messenger</h2>
    <div class="auth-inputs">
      <input class="auth-input" type="text" id="usernameInput" placeholder="Enter Username (e.g. Kainat)" />
      <button class="auth-btn" id="loginBtn">Start Messenger</button>
    </div>
  </div>
</div>

<!-- MAIN MESSENGER INTERFACE -->
<div class="app-root hidden" id="appRoot">

  <!-- SIDEBAR (LEFT) -->
  <div class="sidebar">
    <div class="top-header">
      <span class="brand-title">NKS Messenger</span>
      <div class="header-actions">
        <svg class="icon" id="btnNewChat" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        <svg class="icon" id="btnLogout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      </div>
    </div>

    <div class="search-box">
      <div class="search-input-wrap">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" placeholder="Search or start new chat" />
      </div>
    </div>

    <div class="chat-list" id="chatList"></div>
  </div>

  <!-- CHAT AREA (RIGHT) -->
  <div class="chat-panel" id="chatPanel">
    <div class="active-chat-header">
      <div class="user-avatar">
        <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </div>
      <div class="header-user-info">
        <div class="header-user-name" id="activeTitle">Select a contact</div>
        <div class="header-user-status" id="activeStatus">online</div>
      </div>
      <div class="header-actions">
        <svg class="icon" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        <svg class="icon" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
      </div>
    </div>

    <div class="chat-body" id="chatBody"></div>

    <div class="chat-input-bar">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
      <input class="message-input" type="text" id="msgInput" placeholder="Type a message..." />
      <svg class="icon" id="sendBtn" viewBox="0 0 24 24" style="transform: rotate(45deg); stroke: var(--accent) !important;"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </div>
  </div>

</div>

<!-- NEW CHAT MODAL -->
<div class="modal-overlay" id="newChatModal">
  <div class="modal-content">
    <div class="modal-title">Start New Chat</div>
    <input class="auth-input" type="text" id="newTargetUsername" placeholder="Enter contact name" />
    <div class="modal-btns">
      <button class="btn-secondary" id="closeModalBtn">Cancel</button>
      <button class="btn-primary" id="startChatBtn">Start</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'nks_messenger_chats';
  const SESSION_KEY = 'nks_messenger_user';

  let state = {
    currentUser: localStorage.getItem(SESSION_KEY) || null,
    activeChatUser: null,
    chats: JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      'Support': [{ from: 'Support', text: 'Welcome to NKS Messenger Web!', time: '10:00 AM' }]
    }
  };

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.chats));
  }

  // DOM Elements
  const authScreen = document.getElementById('authScreen');
  const appRoot = document.getElementById('appRoot');
  const loginBtn = document.getElementById('loginBtn');
  const usernameInput = document.getElementById('usernameInput');
  const chatList = document.getElementById('chatList');
  const chatBody = document.getElementById('chatBody');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const activeTitle = document.getElementById('activeTitle');
  const btnLogout = document.getElementById('btnLogout');
  const btnNewChat = document.getElementById('btnNewChat');
  const newChatModal = document.getElementById('newChatModal');
  const closeModalBtn = document.getElementById('closeModalBtn');
  const startChatBtn = document.getElementById('startChatBtn');
  const newTargetUsername = document.getElementById('newTargetUsername');

  function initAuth() {
    if (state.currentUser) {
      authScreen.classList.add('hidden');
      appRoot.classList.remove('hidden');
      renderChatList();
      const firstChat = Object.keys(state.chats)[0];
      if (firstChat) openChat(firstChat);
    } else {
      authScreen.classList.remove('hidden');
      appRoot.classList.add('hidden');
    }
  }

  loginBtn.onclick = () => {
    const val = usernameInput.value.trim();
    if (val) {
      state.currentUser = val;
      localStorage.setItem(SESSION_KEY, val);
      initAuth();
    }
  };

  btnLogout.onclick = () => {
    localStorage.removeItem(SESSION_KEY);
    state.currentUser = null;
    initAuth();
  };

  function renderChatList(filter = '') {
    chatList.innerHTML = '';
    const keys = Object.keys(state.chats).filter(k => k.toLowerCase().includes(filter.toLowerCase()));

    keys.forEach(username => {
      const history = state.chats[username];
      const lastMsg = history.length ? history[history.length - 1] : { text: '', time: '' };

      const row = document.createElement('div');
      row.className = `chat-row ${state.activeChatUser === username ? 'active' : ''}`;
      row.innerHTML = `
        <div class="user-avatar">
          <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
        <div class="chat-details">
          <div class="chat-header-row">
            <span class="chat-username">${username}</span>
            <span class="chat-timestamp">${lastMsg.time || ''}</span>
          </div>
          <div class="chat-last-message">${lastMsg.text || 'No messages'}</div>
        </div>
      `;
      row.onclick = () => openChat(username);
      chatList.appendChild(row);
    });
  }

  function openChat(username) {
    state.activeChatUser = username;
    activeTitle.innerText = username;
    renderChatList();
    renderMessages();
  }

  function renderMessages() {
    chatBody.innerHTML = '';
    const userKey = state.activeChatUser;
    if (!userKey || !state.chats[userKey]) return;

    state.chats[userKey].forEach(msg => {
      const isSent = msg.from === state.currentUser;
      const bubble = document.createElement('div');
      bubble.className = `msg-bubble ${isSent ? 'sent' : 'received'}`;
      bubble.innerHTML = `
        ${msg.text}
        <div class="msg-footer">
          <span class="msg-time">${msg.time}</span>
        </div>
      `;
      chatBody.appendChild(bubble);
    });
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  function sendMessage() {
    const text = msgInput.value.trim();
    const target = state.activeChatUser;
    if (!text || !target) return;

    const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const messageObj = { from: state.currentUser, text, time: timeStr };

    if (!state.chats[target]) state.chats[target] = [];
    state.chats[target].push(messageObj);
    saveState();

    msgInput.value = '';
    renderMessages();
    renderChatList();
  }

  sendBtn.onclick = sendMessage;
  msgInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };

  btnNewChat.onclick = () => newChatModal.classList.add('open');
  closeModalBtn.onclick = () => newChatModal.classList.remove('open');
  startChatBtn.onclick = () => {
    const target = newTargetUsername.value.trim();
    if (target) {
      if (!state.chats[target]) state.chats[target] = [];
      saveState();
      newChatModal.classList.remove('open');
      newTargetUsername.value = '';
      openChat(target);
    }
  };

  document.getElementById('searchInput').oninput = (e) => renderChatList(e.target.value);

  initAuth();
</script>
</body>
</html>
