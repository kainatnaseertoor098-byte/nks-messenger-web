<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NKS Messenger</title>
  <style>
    :root {
      --bg-main: #111b21;
      --bg-side: #111b21;
      --bg-header: #202c33;
      --bg-chat: #0b141a;
      --accent: #00a884;
      --text: #e9edef;
      --text-muted: #8696a0;
      --msg-sent: #005c4b;
      --msg-recv: #202c33;
      --border: #222d34;
      --icon-color: #aebac1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg-main); color: var(--text); }

    /* SVG Icon Global Helper */
    .icon {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: var(--icon-color);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
      display: inline-block;
    }

    /* AUTH SCREEN */
    .auth-screen {
      position: fixed; inset: 0; background: var(--bg-main); z-index: 1000;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .auth-screen.hidden { display: none; }
    .auth-card {
      background: var(--bg-header); border-radius: 16px; padding: 28px;
      width: 100%; max-width: 380px; border: 1px solid var(--border); text-align: center;
    }
    .auth-logo { width: 60px; height: 60px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
    .auth-logo .icon { stroke: #fff; width: 32px; height: 32px; }
    .auth-title { font-size: 1.5rem; margin-bottom: 20px; }
    .auth-inputs { display: flex; flex-direction: column; gap: 12px; }
    .auth-input { padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-main); color: var(--text); font-size: 0.95rem; outline: none; }
    .auth-btn { padding: 12px; border-radius: 8px; border: none; background: var(--accent); color: #111; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 8px; }

    /* APP LAYOUT */
    .app-root { display: flex; width: 100%; height: 100vh; position: relative; }
    .app-root.hidden { display: none; }

    /* CHAT LIST SCREEN */
    .view-list {
      width: 100%; height: 100%; display: flex; flex-direction: column;
      background: var(--bg-main); position: absolute; top: 0; left: 0; z-index: 10;
      transition: transform 0.2s ease;
    }

    .top-header {
      height: 60px; background: var(--bg-header); display: flex;
      align-items: center; justify-content: space-between; padding: 0 16px;
      border-bottom: 1px solid var(--border);
    }
    .brand-title { font-size: 1.3rem; font-weight: 700; color: var(--text); }
    .header-actions { display: flex; gap: 12px; }
    .icon-btn { background: none; border: none; cursor: pointer; padding: 6px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .icon-btn:hover { background: rgba(255,255,255,0.05); }

    .search-box { padding: 10px 14px; background: var(--bg-main); border-bottom: 1px solid var(--border); }
    .search-input-wrap {
      background: var(--bg-header); border-radius: 8px; display: flex; align-items: center; padding: 6px 12px; gap: 10px;
    }
    .search-input-wrap input { background: none; border: none; color: var(--text); outline: none; width: 100%; font-size: 0.9rem; }

    .chat-items { flex: 1; overflow-y: auto; }
    .chat-row { display: flex; align-items: center; padding: 12px 16px; gap: 14px; border-bottom: 1px solid rgba(255,255,255,0.03); cursor: pointer; }
    .chat-row:hover { background: var(--bg-header); }

    .user-avatar { width: 48px; height: 48px; border-radius: 50%; background: #374248; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
    
    .chat-details { flex: 1; min-width: 0; }
    .chat-header-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .chat-username { font-weight: 600; font-size: 1rem; }
    .chat-timestamp { font-size: 0.75rem; color: var(--text-muted); }
    .chat-last-message { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* FLOATING ACTION BUTTON */
    .fab-button {
      position: absolute; bottom: 24px; right: 24px; width: 56px; height: 56px;
      border-radius: 50%; background: var(--accent); border: none;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4); cursor: pointer; z-index: 15;
    }
    .fab-button .icon { stroke: #111; }

    /* CONVERSATION SCREEN */
    .view-chat {
      width: 100%; height: 100%; display: flex; flex-direction: column;
      background: var(--bg-chat); position: absolute; top: 0; left: 100%; z-index: 20;
      transition: transform 0.25s ease;
    }
    .app-root.active-chat .view-chat { transform: translateX(-100%); }

    .active-chat-header {
      height: 60px; background: var(--bg-header); display: flex;
      align-items: center; padding: 0 12px; gap: 8px; border-bottom: 1px solid var(--border);
    }
    .header-user-info { flex: 1; display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .header-user-name { font-weight: 600; font-size: 1rem; }
    .header-user-status { font-size: 0.75rem; color: var(--accent); }

    .chat-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }

    .msg-bubble { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 0.95rem; word-break: break-word; line-height: 1.4; position: relative; }
    .msg-bubble.sent { align-self: flex-end; background: var(--msg-sent); border-top-right-radius: 0; }
    .msg-bubble.received { align-self: flex-start; background: var(--msg-recv); border-top-left-radius: 0; }

    .msg-footer { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 2px; }
    .msg-time { font-size: 0.65rem; color: rgba(255,255,255,0.6); }
    .msg-status .icon { width: 14px; height: 14px; stroke: #53bdeb; }

    .chat-input-bar { height: 62px; background: var(--bg-header); display: flex; align-items: center; padding: 0 10px; gap: 8px; }
    .message-input { flex: 1; background: var(--bg-main); border: none; padding: 12px 16px; border-radius: 20px; color: var(--text); outline: none; font-size: 0.95rem; }
    .send-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .send-btn .icon { stroke: #111; }

    /* MODAL OVERLAYS */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal-content { background: var(--bg-header); border-radius: 12px; padding: 20px; width: 100%; max-width: 350px; border: 1px solid var(--border); }
    .modal-title { font-size: 1.1rem; margin-bottom: 12px; font-weight: 600; }
    .modal-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .btn-secondary { background: var(--bg-main); color: var(--text); border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    .btn-primary { background: var(--accent); color: #111; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

<!-- AUTH SCREEN -->
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">
      <svg class="icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
    </div>
    <h2 class="auth-title">NKS Messenger</h2>
    <div class="auth-inputs">
      <input class="auth-input" type="text" id="usernameInput" placeholder="Enter Username (e.g. kainat)" />
      <button class="auth-btn" id="loginBtn">Start Chatting</button>
    </div>
  </div>
</div>

<!-- MAIN APP CONTAINER -->
<div class="app-root hidden" id="appRoot">

  <!-- CHAT LIST VIEW -->
  <div class="view-list">
    <div class="top-header">
      <span class="brand-title">WhatsApp Web</span>
      <div class="header-actions">
        <button class="icon-btn" id="logoutBtn" title="Logout">
          <svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
      </div>
    </div>

    <div class="search-box">
      <div class="search-input-wrap">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" placeholder="Search or start new chat" />
      </div>
    </div>

    <div class="chat-items" id="chatList"></div>

    <button class="fab-button" id="fabNewChat">
      <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
  </div>

  <!-- CONVERSATION VIEW -->
  <div class="view-chat">
    <div class="active-chat-header">
      <button class="icon-btn" id="backBtn">
        <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </button>
      <div class="user-avatar" id="activeAvatar">
        <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </div>
      <div class="header-user-info">
        <div>
          <div class="header-user-name" id="activeTitle">User</div>
          <div class="header-user-status">online</div>
        </div>
      </div>
    </div>

    <div class="chat-body" id="chatBody"></div>

    <div class="chat-input-bar">
      <input class="message-input" type="text" id="msgInput" placeholder="Type a message..." />
      <button class="send-btn" id="sendBtn">
        <svg class="icon" viewBox="0 0 24 24" style="transform: rotate(45deg);"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
  </div>

</div>

<!-- NEW CHAT MODAL -->
<div class="modal-overlay" id="newChatModal">
  <div class="modal-content">
    <div class="modal-title">New Conversation</div>
    <input class="auth-input" type="text" id="newTargetUsername" placeholder="Enter recipient username" />
    <div class="modal-btns">
      <button class="btn-secondary" id="closeModalBtn">Cancel</button>
      <button class="btn-primary" id="startChatBtn">Start Chat</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'nks_whatsapp_store';
  const SESSION_KEY = 'nks_active_user';

  let appState = {
    currentUser: localStorage.getItem(SESSION_KEY) || null,
    activeChatUser: null,
    chats: JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      'Support Team': [{ from: 'Support Team', text: 'Welcome to NKS Messenger!', time: '10:00 AM' }]
    }
  };

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState.chats));
  }

  // DOM Elements
  const authScreen = document.getElementById('authScreen');
  const appRoot = document.getElementById('appRoot');
  const loginBtn = document.getElementById('loginBtn');
  const usernameInput = document.getElementById('usernameInput');
  const chatList = document.getElementById('chatList');
  const chatBody = document.getElementById('chatBody');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const backBtn = document.getElementById('backBtn');
  const activeTitle = document.getElementById('activeTitle');
  const logoutBtn = document.getElementById('logoutBtn');
  const fabNewChat = document.getElementById('fabNewChat');
  const newChatModal = document.getElementById('newChatModal');
  const closeModalBtn = document.getElementById('closeModalBtn');
  const startChatBtn = document.getElementById('startChatBtn');
  const newTargetUsername = document.getElementById('newTargetUsername');

  // Authentication Flow
  function initAuth() {
    if (appState.currentUser) {
      authScreen.classList.add('hidden');
      appRoot.classList.remove('hidden');
      renderChatList();
    } else {
      authScreen.classList.remove('hidden');
      appRoot.classList.add('hidden');
    }
  }

  loginBtn.onclick = () => {
    const val = usernameInput.value.trim();
    if (val) {
      appState.currentUser = val;
      localStorage.setItem(SESSION_KEY, val);
      initAuth();
    }
  };

  logoutBtn.onclick = () => {
    localStorage.removeItem(SESSION_KEY);
    appState.currentUser = null;
    initAuth();
  };

  // Chat List UI
  function renderChatList(filter = '') {
    chatList.innerHTML = '';
    const keys = Object.keys(appState.chats).filter(k => k.toLowerCase().includes(filter.toLowerCase()));

    keys.forEach(username => {
      const history = appState.chats[username];
      const lastMsg = history.length ? history[history.length - 1] : { text: '', time: '' };

      const row = document.createElement('div');
      row.className = 'chat-row';
      row.innerHTML = `
        <div class="user-avatar">
          <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
        <div class="chat-details">
          <div class="chat-header-row">
            <span class="chat-username">${username}</span>
            <span class="chat-timestamp">${lastMsg.time || ''}</span>
          </div>
          <div class="chat-last-message">${lastMsg.text || 'No messages yet'}</div>
        </div>
      `;
      row.onclick = () => openChat(username);
      chatList.appendChild(row);
    });
  }

  // Conversation UI
  function openChat(username) {
    appState.activeChatUser = username;
    activeTitle.innerText = username;
    appRoot.classList.add('active-chat');
    renderMessages();
  }

  backBtn.onclick = () => {
    appRoot.classList.remove('active-chat');
    appState.activeChatUser = null;
    renderChatList();
  };

  function renderMessages() {
    chatBody.innerHTML = '';
    const userKey = appState.activeChatUser;
    if (!userKey || !appState.chats[userKey]) return;

    appState.chats[userKey].forEach(msg => {
      const isSent = msg.from === appState.currentUser;
      const bubble = document.createElement('div');
      bubble.className = `msg-bubble ${isSent ? 'sent' : 'received'}`;
      bubble.innerHTML = `
        ${msg.text}
        <div class="msg-footer">
          <span class="msg-time">${msg.time}</span>
          ${isSent ? '<span class="msg-status"><svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></span>' : ''}
        </div>
      `;
      chatBody.appendChild(bubble);
    });
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  // Messaging Engine
  function sendMessage() {
    const text = msgInput.value.trim();
    const target = appState.activeChatUser;
    if (!text || !target) return;

    const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const messageObj = { from: appState.currentUser, text, time: timeStr };

    if (!appState.chats[target]) appState.chats[target] = [];
    appState.chats[target].push(messageObj);
    saveState();

    msgInput.value = '';
    renderMessages();
  }

  sendBtn.onclick = sendMessage;
  msgInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };

  // New Chat Controls
  fabNewChat.onclick = () => newChatModal.classList.add('open');
  closeModalBtn.onclick = () => newChatModal.classList.remove('open');
  startChatBtn.onclick = () => {
    const target = newTargetUsername.value.trim();
    if (target) {
      if (!appState.chats[target]) appState.chats[target] = [];
      saveState();
      newChatModal.classList.remove('open');
      newTargetUsername.value = '';
      renderChatList();
      openChat(target);
    }
  };

  document.getElementById('searchInput').oninput = (e) => renderChatList(e.target.value);

  // Initialize App
  initAuth();
</script>
</body>
</html>
