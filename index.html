<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NKS Web Messenger</title>
  <style>
    :root {
      --bg-main: #111b21;
      --bg-side: #111b21;
      --bg-header: #202c33;
      --bg-chat: #0b141a;
      --accent: #00a884;
      --text: #e9edef;
      --text-muted: #8696a0;
      --msg-sent: #005c4b;
      --msg-recv: #202c33;
      --border: #222d34;
      --icon-color: #aebac1;
    }

    [data-theme="light"] {
      --bg-main: #f0f2f5;
      --bg-side: #ffffff;
      --bg-header: #f0f2f5;
      --bg-chat: #efeae2;
      --accent: #00a884;
      --text: #111b21;
      --text-muted: #667781;
      --msg-sent: #d9fdd3;
      --msg-recv: #ffffff;
      --border: #e9edef;
      --icon-color: #54656f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg-main); color: var(--text); }

    .icon {
      width: 22px; height: 22px; fill: none; stroke: var(--icon-color);
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      flex-shrink: 0; display: inline-block; cursor: pointer;
    }

    /* AUTH SCREEN */
    .auth-screen {
      position: fixed; inset: 0; background: var(--bg-main); z-index: 1000;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .auth-screen.hidden { display: none; }
    .auth-card {
      background: var(--bg-header); border-radius: 16px; padding: 28px;
      width: 100%; max-width: 380px; border: 1px solid var(--border); text-align: center;
    }
    .auth-logo { width: 60px; height: 60px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
    .auth-logo .icon { stroke: #fff; width: 32px; height: 32px; }
    .auth-title { font-size: 1.5rem; margin-bottom: 20px; }
    .auth-inputs { display: flex; flex-direction: column; gap: 12px; }
    .auth-input { padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-main); color: var(--text); font-size: 0.95rem; outline: none; }
    .auth-btn { padding: 12px; border-radius: 8px; border: none; background: var(--accent); color: #111; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 8px; }

    /* MAIN APP LAYOUT */
    .app-root { display: flex; width: 100%; height: 100vh; position: relative; }
    .app-root.hidden { display: none; }

    /* SIDE NAVIGATION (CHATS, STATUS, CONTACTS, SETTINGS) */
    .nav-tabs {
      width: 60px; background: var(--bg-header); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 20px;
    }
    .nav-item { padding: 10px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .nav-item.active { background: rgba(0, 168, 132, 0.2); }
    .nav-item.active .icon { stroke: var(--accent); }

    /* VIEWS */
    .main-view { flex: 1; display: flex; relative; height: 100%; overflow: hidden; }
    .view-sidebar {
      width: 100%; max-width: 400px; height: 100%; display: flex; flex-direction: column;
      background: var(--bg-side); border-right: 1px solid var(--border);
    }
    .top-header {
      height: 60px; background: var(--bg-header); display: flex;
      align-items: center; justify-content: space-between; padding: 0 16px;
      border-bottom: 1px solid var(--border);
    }
    .brand-title { font-size: 1.3rem; font-weight: 700; color: var(--text); }

    .search-box { padding: 10px 14px; background: var(--bg-side); border-bottom: 1px solid var(--border); }
    .search-input-wrap {
      background: var(--bg-header); border-radius: 8px; display: flex; align-items: center; padding: 6px 12px; gap: 10px;
    }
    .search-input-wrap input { background: none; border: none; color: var(--text); outline: none; width: 100%; font-size: 0.9rem; }

    .content-list { flex: 1; overflow-y: auto; }
    .list-row { display: flex; align-items: center; padding: 12px 16px; gap: 14px; border-bottom: 1px solid rgba(255,255,255,0.03); cursor: pointer; }
    .list-row:hover { background: var(--bg-header); }

    .user-avatar { width: 46px; height: 46px; border-radius: 50%; background: #374248; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .row-details { flex: 1; min-width: 0; }
    .row-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .row-name { font-weight: 600; font-size: 0.95rem; }
    .row-time { font-size: 0.75rem; color: var(--text-muted); }
    .row-sub { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* CONVERSATION AREA */
    .view-chat {
      flex: 1; height: 100%; display: flex; flex-direction: column;
      background: var(--bg-chat); position: relative;
    }

    .active-chat-header {
      height: 60px; background: var(--bg-header); display: flex;
      align-items: center; padding: 0 16px; gap: 12px; border-bottom: 1px solid var(--border);
    }
    .header-user-info { flex: 1; display: flex; align-items: center; gap: 12px; }
    .header-user-name { font-weight: 600; font-size: 1rem; }
    .header-user-status { font-size: 0.75rem; color: var(--accent); }
    .call-actions { display: flex; gap: 16px; }

    .chat-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }

    .msg-bubble { max-width: 70%; padding: 8px 12px; border-radius: 8px; font-size: 0.95rem; word-break: break-word; line-height: 1.4; position: relative; }
    .msg-bubble.sent { align-self: flex-end; background: var(--msg-sent); }
    .msg-bubble.received { align-self: flex-start; background: var(--msg-recv); }
    .msg-img { max-width: 100%; border-radius: 8px; margin-top: 4px; }

    .msg-footer { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 2px; }
    .msg-time { font-size: 0.65rem; color: var(--text-muted); }

    .chat-input-bar { min-height: 62px; background: var(--bg-header); display: flex; align-items: center; padding: 0 12px; gap: 10px; border-top: 1px solid var(--border); }
    .message-input { flex: 1; background: var(--bg-main); border: none; padding: 12px 16px; border-radius: 20px; color: var(--text); outline: none; font-size: 0.95rem; }

    /* EMOJI PICKER POPUP */
    .emoji-picker { position: absolute; bottom: 70px; left: 16px; background: var(--bg-header); border: 1px solid var(--border); border-radius: 12px; padding: 10px; display: none; grid-template-columns: repeat(5, 1fr); gap: 8px; font-size: 1.3rem; cursor: pointer; z-index: 100; }
    .emoji-picker.open { display: grid; }

    /* CALL OVERLAY */
    .call-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 3000; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; color: #fff; }
    .call-overlay.active { display: flex; }
    .call-avatar { width: 100px; height: 100px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; }
    .call-btns { display: flex; gap: 24px; margin-top: 20px; }
    .btn-call-end { width: 56px; height: 56px; border-radius: 50%; background: #f15c6d; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }

    /* MODAL OVERLAYS */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal-content { background: var(--bg-header); border-radius: 12px; padding: 20px; width: 100%; max-width: 380px; border: 1px solid var(--border); }
    .modal-title { font-size: 1.1rem; margin-bottom: 12px; font-weight: 600; }
    .modal-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .btn-secondary { background: var(--bg-main); color: var(--text); border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    .btn-primary { background: var(--accent); color: #111; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
  </style>
</head>
<body>

<!-- AUTH SCREEN -->
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">
      <svg class="icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
    </div>
    <h2 class="auth-title">NKS Web Messenger</h2>
    <div class="auth-inputs">
      <input class="auth-input" type="text" id="usernameInput" placeholder="Enter Username (e.g. kainat)" />
      <button class="auth-btn" id="loginBtn">Start Messenger</button>
    </div>
  </div>
</div>

<!-- APP ROOT -->
<div class="app-root hidden" id="appRoot">

  <!-- LEFT NAVIGATION SIDEBAR -->
  <div class="nav-tabs">
    <div class="nav-item active" id="tabChats" title="Chats">
      <svg class="icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
    </div>
    <div class="nav-item" id="tabStatus" title="Status">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>
    </div>
    <div class="nav-item" id="tabContacts" title="Contacts">
      <svg class="icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
    </div>
    <div class="nav-item" id="tabSettings" title="Settings & Privacy">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </div>
  </div>

  <div class="main-view">
    <!-- SECONDARY SIDEBAR (LISTS) -->
    <div class="view-sidebar">
      <div class="top-header">
        <span class="brand-title" id="sectionTitle">NKS Messenger</span>
        <svg class="icon" id="btnNewAction" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </div>

      <div class="search-box">
        <div class="search-input-wrap">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="searchInput" placeholder="Search..." />
        </div>
      </div>

      <div class="content-list" id="sidebarList"></div>
    </div>

    <!-- MAIN CHAT PANEL -->
    <div class="view-chat">
      <div class="active-chat-header">
        <div class="user-avatar" id="activeAvatar">
          <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
        <div class="header-user-info">
          <div>
            <div class="header-user-name" id="activeTitle">Select a contact</div>
            <div class="header-user-status" id="activeStatus">Online</div>
          </div>
        </div>
        <div class="call-actions">
          <svg class="icon" id="btnVoiceCall" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
          <svg class="icon" id="btnVideoCall" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
        </div>
      </div>

      <div class="chat-body" id="chatBody"></div>

      <!-- EMOJI PICKER POPUP -->
      <div class="emoji-picker" id="emojiPicker">
        <span>😊</span><span>😂</span><span>❤️</span><span>👍</span><span>🎉</span>
        <span>🔥</span><span>🙌</span><span>😎</span><span>✨</span><span>🙏</span>
      </div>

      <div class="chat-input-bar">
        <svg class="icon" id="btnEmoji" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
        
        <label for="imgUpload">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
        </label>
        <input type="file" id="imgUpload" accept="image/*" style="display: none;" />

        <input class="message-input" type="text" id="msgInput" placeholder="Type a message..." />
        
        <svg class="icon" id="sendBtn" viewBox="0 0 24 24" style="transform: rotate(45deg); stroke: var(--accent);"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </div>
    </div>
  </div>

</div>

<!-- CALL OVERLAY -->
<div class="call-overlay" id="callOverlay">
  <div class="call-avatar">
    <svg class="icon" viewBox="0 0 24 24" style="stroke: #fff; width: 48px; height: 48px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
  </div>
  <h3 id="callUser">User</h3>
  <p id="callType">Calling...</p>
  <div class="call-btns">
    <button class="btn-call-end" id="endCallBtn">
      <svg class="icon" viewBox="0 0 24 24" style="stroke: #fff;"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path><line x1="23" y1="1" x2="1" y2="23"></line></svg>
    </button>
  </div>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="modalContainer">
  <div class="modal-content" id="modalContent"></div>
</div>

<script>
  const STORAGE_KEY = 'nks_messenger_store_v1';
  const SESSION_KEY = 'nks_active_user_v1';

  let state = {
    currentUser: localStorage.getItem(SESSION_KEY) || null,
    activeTab: 'chats',
    activeChatUser: null,
    chats: JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      'Support Team': [{ from: 'Support Team', text: 'Welcome to NKS Messenger!', time: '10:00 AM' }]
    },
    contacts: ['Support Team', 'Ahmad', 'Sara', 'Zain'],
    statusList: [
      { user: 'Sara', time: 'Today, 12:30 PM', text: 'At work 💻' }
    ],
    privacy: { readReceipts: true, lastSeen: 'Everyone', theme: 'dark' }
  };

  function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.chats)); }

  // DOM Elements
  const authScreen = document.getElementById('authScreen');
  const appRoot = document.getElementById('appRoot');
  const loginBtn = document.getElementById('loginBtn');
  const usernameInput = document.getElementById('usernameInput');
  const sidebarList = document.getElementById('sidebarList');
  const sectionTitle = document.getElementById('sectionTitle');
  const chatBody = document.getElementById('chatBody');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const activeTitle = document.getElementById('activeTitle');
  const modalContainer = document.getElementById('modalContainer');
  const modalContent = document.getElementById('modalContent');
  const emojiPicker = document.getElementById('emojiPicker');
  const callOverlay = document.getElementById('callOverlay');

  // Auth Initialization
  function initAuth() {
    if (state.currentUser) {
      authScreen.classList.add('hidden');
      appRoot.classList.remove('hidden');
      renderSidebar();
    } else {
      authScreen.classList.remove('hidden');
      appRoot.classList.add('hidden');
    }
  }

  loginBtn.onclick = () => {
    const val = usernameInput.value.trim();
    if (val) {
      state.currentUser = val;
      localStorage.setItem(SESSION_KEY, val);
      initAuth();
    }
  };

  // Tab Switching (Chats, Status, Contacts, Settings)
  ['Chats', 'Status', 'Contacts', 'Settings'].forEach(tab => {
    document.getElementById(`tab${tab}`).onclick = () => {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab${tab}`).classList.add('active');
      state.activeTab = tab.toLowerCase();
      sectionTitle.innerText = tab === 'Settings' ? 'Settings & Privacy' : tab;
      renderSidebar();
    };
  });

  // Render Sidebar Content based on active tab
  function renderSidebar(filter = '') {
    sidebarList.innerHTML = '';

    if (state.activeTab === 'chats') {
      Object.keys(state.chats).filter(k => k.toLowerCase().includes(filter.toLowerCase())).forEach(user => {
        const history = state.chats[user];
        const lastMsg = history.length ? history[history.length - 1] : { text: '', time: '' };
        sidebarList.appendChild(createListRow(user, lastMsg.text || 'Image', lastMsg.time || '', () => openChat(user)));
      });
    } else if (state.activeTab === 'contacts') {
      state.contacts.filter(c => c.toLowerCase().includes(filter.toLowerCase())).forEach(contact => {
        sidebarList.appendChild(createListRow(contact, 'Available', '', () => openChat(contact)));
      });
    } else if (state.activeTab === 'status') {
      state.statusList.forEach(s => {
        sidebarList.appendChild(createListRow(s.user, s.text, s.time, () => alert(`${s.user}'s Status: ${s.text}`)));
      });
    } else if (state.activeTab === 'settings') {
      renderSettings();
    }
  }

  function createListRow(name, sub, time, onClick) {
    const row = document.createElement('div');
    row.className = 'list-row';
    row.innerHTML = `
      <div class="user-avatar"><svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
      <div class="row-details">
        <div class="row-header"><span class="row-name">${name}</span><span class="row-time">${time}</span></div>
        <div class="row-sub">${sub}</div>
      </div>
    `;
    row.onclick = onClick;
    return row;
  }

  // Render Settings Panel
  function renderSettings() {
    sidebarList.innerHTML = `
      <div style="padding: 16px;">
        <div class="setting-item">
          <span>Dark / Light Theme</span>
          <button class="btn-secondary" id="toggleThemeBtn">${state.privacy.theme}</button>
        </div>
        <div class="setting-item">
          <span>Read Receipts</span>
          <input type="checkbox" ${state.privacy.readReceipts ? 'checked' : ''} id="toggleReceipts" />
        </div>
        <div class="setting-item">
          <span>Last Seen Privacy</span>
          <span style="font-size:0.85rem; color:var(--text-muted);">${state.privacy.lastSeen}</span>
        </div>
        <button class="btn-primary" id="logoutBtn" style="width:100%; margin-top:20px; background:#f15c6d; color:#fff;">Logout</button>
      </div>
    `;

    document.getElementById('toggleThemeBtn').onclick = () => {
      state.privacy.theme = state.privacy.theme === 'dark' ? 'light' : 'dark';
      document.body.setAttribute('data-theme', state.privacy.theme);
      renderSettings();
    };

    document.getElementById('logoutBtn').onclick = () => {
      localStorage.removeItem(SESSION_KEY);
      state.currentUser = null;
      initAuth();
    };
  }

  // Chat Execution
  function openChat(username) {
    state.activeChatUser = username;
    activeTitle.innerText = username;
    renderMessages();
  }

  function renderMessages() {
    chatBody.innerHTML = '';
    const userKey = state.activeChatUser;
    if (!userKey || !state.chats[userKey]) return;

    state.chats[userKey].forEach(msg => {
      const isSent = msg.from === state.currentUser;
      const bubble = document.createElement('div');
      bubble.className = `msg-bubble ${isSent ? 'sent' : 'received'}`;
      
      let content = msg.text || '';
      if (msg.image) content += `<br><img src="${msg.image}" class="msg-img"/>`;

      bubble.innerHTML = `
        ${content}
        <div class="msg-footer"><span class="msg-time">${msg.time}</span></div>
      `;
      chatBody.appendChild(bubble);
    });
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  function sendMessage(text = '', image = null) {
    const target = state.activeChatUser;
    if ((!text && !image) || !target) return;

    const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const msgObj = { from: state.currentUser, text, image, time: timeStr };

    if (!state.chats[target]) state.chats[target] = [];
    state.chats[target].push(msgObj);
    saveData();

    msgInput.value = '';
    renderMessages();
    renderSidebar();
  }

  sendBtn.onclick = () => sendMessage(msgInput.value.trim());
  msgInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(msgInput.value.trim()); };

  // Image File Upload
  document.getElementById('imgUpload').onchange = (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (evt) => sendMessage('', evt.target.result);
      reader.readAsDataURL(file);
    }
  };

  // Emoji Picker Wiring
  document.getElementById('btnEmoji').onclick = () => emojiPicker.classList.toggle('open');
  emojiPicker.querySelectorAll('span').forEach(el => {
    el.onclick = () => {
      msgInput.value += el.innerText;
      emojiPicker.classList.remove('open');
    };
  });

  // Voice & Video Call Trigger
  function triggerCall(type) {
    if (!state.activeChatUser) return alert('Select a user to call');
    document.getElementById('callUser').innerText = state.activeChatUser;
    document.getElementById('callType').innerText = `NKS ${type} Call...`;
    callOverlay.classList.add('active');
  }

  document.getElementById('btnVoiceCall').onclick = () => triggerCall('Voice');
  document.getElementById('btnVideoCall').onclick = () => triggerCall('Video');
  document.getElementById('endCallBtn').onclick = () => callOverlay.classList.remove('active');

  // Search Input Handler
  document.getElementById('searchInput').oninput = (e) => renderSidebar(e.target.value);

  // Initialize
  initAuth();
</script>
</body>
</html>
