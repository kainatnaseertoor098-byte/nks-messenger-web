<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NKS Messenger - WhatsApp Style</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --accent: #10b981;
      --accent-light: #34d399;
      --muted: #94a3b8;
      --card: #334155;
      --text: #f8fafc;
      --danger: #ef4444;
      --online: #22c55e;
      --away: #eab308;
      --offline: #64748b;
      --border: #0b1220;
      --msg-sent: #10b981;
      --msg-received: #475569;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    body {
      background: var(--bg-primary);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      padding: 0;
    }

    /* ===== LOGIN SCREEN ===== */
    .login-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      width: 100%;
      height: 100%;
    }

    .login-screen.hidden {
      display: none;
    }

    .login-container {
      background: var(--bg-secondary);
      border-radius: 20px;
      padding: 40px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border);
    }

    .login-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .login-logo-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2rem;
      font-weight: 900;
    }

    .login-logo-text {
      font-size: 2.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent), #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
      color: var(--text);
    }

    .login-subtitle {
      font-size: 0.95rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 28px;
    }

    .login-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .login-tabs button {
      flex: 1;
      padding: 10px;
      border: none;
      background: var(--card);
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .login-tabs button.active {
      background: var(--accent);
      color: #04281b;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .login-input {
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .login-input:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(16, 185, 129, 0.05);
    }

    .login-input::placeholder {
      color: var(--muted);
    }

    .login-btn {
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #04281b;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 8px;
    }

    .login-btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-footer {
      text-align: center;
      margin-top: 16px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    /* ===== MAIN CONTAINER ===== */
    .container {
      display: flex;
      width: 100%;
      height: 100vh;
      gap: 0;
    }

    .container.hidden {
      display: none;
    }

    /* ===== LEFT SIDEBAR (CHATS LIST) ===== */
    .sidebar {
      width: 360px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-name {
      font-size: 2rem;
      font-weight: 900;
      color: var(--accent);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      position: relative;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: var(--accent);
      color: #04281b;
      transform: scale(1.05);
    }

    .search-container {
      padding: 8px 16px;
    }

    .search-box {
      width: 100%;
      padding: 10px 16px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .search-box:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(16, 185, 129, 0.05);
    }

    .search-box::placeholder {
      color: var(--muted);
    }

    /* ===== CONTACTS LIST ===== */
    .contacts-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .contact-item {
      display: flex;
      gap: 12px;
      padding: 8px 12px;
      background: transparent;
      border-radius: 12px;
      cursor: pointer;
      align-items: center;
      transition: all 0.2s;
      margin-bottom: 4px;
      position: relative;
    }

    .contact-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .contact-item.active {
      background: var(--card);
      border-left: 4px solid var(--accent);
      padding-left: 8px;
    }

    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, var(--accent), #06b6d4);
      font-size: 1.4rem;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 3px solid var(--bg-secondary);
      bottom: 0;
      right: 0;
    }

    .avatar.online::after {
      background: var(--online);
    }

    .avatar.away::after {
      background: var(--away);
    }

    .avatar.offline::after {
      background: var(--offline);
    }

    .contact-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .contact-name {
      font-weight: 600;
      color: var(--text);
      font-size: 0.95rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .contact-handle {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 500;
    }

    .contact-preview {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== CHAT SECTION (MIDDLE) ===== */
    .chat-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.5), rgba(30, 41, 59, 0.3));
    }

    .chat-header {
      padding: 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .chat-user-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
      font-size: 1.1rem;
      overflow: hidden;
    }

    .chat-user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .chat-user-details h3 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
    }

    .chat-user-details p {
      margin: 0;
      font-size: 0.8rem;
      color: var(--accent);
    }

    .chat-header-actions {
      display: flex;
      gap: 8px;
    }

    .header-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.2s;
    }

    .header-btn:hover {
      background: rgba(16, 185, 129, 0.2);
    }

    /* ===== MESSAGES ===== */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.3), rgba(30, 41, 59, 0.2));
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      gap: 12px;
      text-align: center;
      padding: 20px;
    }

    .empty-state-icon {
      font-size: 4rem;
      opacity: 0.3;
    }

    .empty-state-text {
      font-size: 0.95rem;
    }

    .message {
      display: flex;
      gap: 8px;
      max-width: 55%;
      align-items: flex-end;
      animation: slideIn 0.3s ease-out;
      margin-bottom: 4px;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.sent {
      justify-content: flex-end;
      margin-left: auto;
    }

    .message.received {
      justify-content: flex-start;
    }

    .message-bubble {
      padding: 10px 14px;
      border-radius: 18px;
      word-break: break-word;
      max-width: 100%;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    }

    .message.sent .message-bubble {
      background: var(--msg-sent);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.received .message-bubble {
      background: var(--msg-received);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .message-time {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ===== COMPOSER ===== */
    .composer {
      padding: 12px 16px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .input-wrapper {
      flex: 1;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .message-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
      font-size: 0.9rem;
      resize: none;
      max-height: 100px;
      transition: all 0.2s;
    }

    .message-input:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(16, 185, 129, 0.05);
    }

    .message-input::placeholder {
      color: var(--muted);
    }

    .attach-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 0.2s;
    }

    .attach-btn:hover {
      background: rgba(16, 185, 129, 0.1);
      transform: scale(1.1);
    }

    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #04281b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 700;
      transition: all 0.2s;
    }

    .send-btn:hover {
      opacity: 0.9;
      transform: scale(1.05);
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    /* ===== RIGHT PANEL (PROFILE) ===== */
    .info-panel {
      width: 320px;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .info-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .info-header h3 {
      margin: 0 0 12px 0;
      font-size: 1rem;
      font-weight: 600;
    }

    .info-content {
      padding: 16px;
      overflow-y: auto;
    }

    .profile-card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 16px;
    }

    .profile-avatar-large {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 700;
      color: white;
      margin: 0 auto 12px;
      overflow: hidden;
    }

    .profile-avatar-large img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-name {
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text);
      font-size: 1.1rem;
    }

    .profile-handle {
      font-size: 0.9rem;
      color: var(--accent);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .profile-status {
      font-size: 0.85rem;
      color: var(--muted);
    }

    /* ===== MODALS ===== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--bg-secondary);
      border-radius: 16px;
      padding: 24px;
      max-width: 450px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border);
    }

    .modal h3 {
      margin-bottom: 16px;
      color: var(--text);
      font-size: 1.2rem;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: var(--text);
      font-weight: 500;
    }

    .form-input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(16, 185, 129, 0.05);
    }

    .form-input::placeholder {
      color: var(--muted);
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .modal-actions button {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .modal-actions .cancel {
      background: var(--card);
      color: var(--text);
    }

    .modal-actions .confirm {
      background: var(--accent);
      color: #04281b;
    }

    /* ===== MENU DROPDOWN ===== */
    .menu-dropdown {
      position: absolute;
      top: 60px;
      right: 0;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      z-index: 200;
      min-width: 200px;
      overflow: hidden;
      display: none;
    }

    .menu-dropdown.active {
      display: block;
      animation: slideDown 0.2s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: background 0.2s;
      color: var(--text);
    }

    .menu-item:last-child {
      border-bottom: none;
    }

    .menu-item:hover {
      background: var(--card);
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--card);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 1200px) {
      .info-panel {
        width: 280px;
      }
      .sidebar {
        width: 300px;
      }
    }

    @media (max-width: 900px) {
      .info-panel {
        display: none;
      }
      .sidebar {
        width: 280px;
      }
    }

    @media (max-width: 600px) {
      .sidebar {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 280px;
        z-index: 100;
        display: none;
      }
      .sidebar.visible {
        display: flex;
      }
      .chat-section {
        width: 100%;
      }
      .info-panel {
        display: none;
      }
      .message {
        max-width: 80%;
      }
    }

    .search-results {
      margin-bottom: 16px;
      max-height: 300px;
      overflow-y: auto;
    }

    .search-result-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--card);
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 8px;
      transition: all 0.2s;
    }

    .search-result-item:hover {
      background: rgba(16, 185, 129, 0.2);
    }

    .search-result-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      flex-shrink: 0;
    }

    .search-result-info {
      flex: 1;
      min-width: 0;
    }

    .search-result-name {
      font-weight: 600;
      color: var(--text);
      font-size: 0.9rem;
    }

    .search-result-handle {
      font-size: 0.8rem;
      color: var(--accent);
    }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="loginScreen">
  <div class="login-container">
    <div class="login-logo">
      <div class="login-logo-icon">💬</div>
      <div class="login-logo-text">NKS</div>
    </div>
    <h2 class="login-title">NKS Messenger</h2>
    <p class="login-subtitle">Connect with anyone, anywhere</p>
    
    <div class="login-tabs">
      <button id="loginTabBtn" class="active">Sign In</button>
      <button id="signupTabBtn">Create Account</button>
    </div>

    <!-- LOGIN FORM -->
    <div class="login-form" id="loginForm">
      <input class="login-input" type="text" id="loginUsername" placeholder="Username" />
      <input class="login-input" type="password" id="loginPassword" placeholder="Password" />
      <button class="login-btn" id="loginBtn">Sign In</button>
    </div>

    <!-- SIGNUP FORM -->
    <div class="login-form" id="signupForm" style="display:none;">
      <input class="login-input" type="text" id="signupUsername" placeholder="Choose username" />
      <input class="login-input" type="text" id="signupName" placeholder="Full name" />
      <input class="login-input" type="password" id="signupPassword" placeholder="Create password" />
      <input class="login-input" type="password" id="signupConfirmPassword" placeholder="Confirm password" />
      <button class="login-btn" id="signupBtn">Create Account</button>
    </div>

    <div class="login-footer">
      Demo: username: demo | password: demo123
    </div>
  </div>
</div>

<!-- MAIN CONTAINER -->
<div class="container" id="mainContainer">
  <!-- LEFT: CHATS LIST -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="app-name">NKS</div>
      <div class="header-actions">
        <button class="icon-btn" id="searchBtn" title="Search">🔍</button>
        <button class="icon-btn" id="menuBtn" title="More">⋮</button>
        <div class="menu-dropdown" id="menuDropdown">
          <div class="menu-item" id="newChatMenu">💬 New Chat</div>
          <div class="menu-item" id="settingsMenu">⚙️ Settings</div>
          <div class="menu-item" id="logoutMenu">🚪 Logout</div>
        </div>
      </div>
    </div>
    
    <div class="search-container">
      <input class="search-box" id="searchInput" placeholder="Search username or chat..." />
    </div>
    
    <div class="contacts-list" id="contactsList"></div>
  </div>

  <!-- MIDDLE: CHAT AREA -->
  <div class="chat-section">
    <div class="chat-header" id="chatHeader" style="display:none;">
      <div class="chat-header-info">
        <div class="chat-user-avatar" id="chatAvatar">👤</div>
        <div class="chat-user-details">
          <h3 id="chatName">-</h3>
          <p id="chatStatus">Offline</p>
        </div>
      </div>
      <div class="chat-header-actions">
        <button class="header-btn" id="callBtn" title="Call">📞</button>
        <button class="header-btn" id="videoBtn" title="Video">📹</button>
        <button class="header-btn" id="infoBtn" title="Info">ℹ️</button>
      </div>
    </div>
    
    <div class="messages-container" id="messagesContainer">
      <div class="empty-state">
        <div class="empty-state-icon">💬</div>
        <div class="empty-state-text">Select a chat to start messaging</div>
      </div>
    </div>
    
    <div class="composer" id="composerSection" style="display:none;">
      <div class="input-wrapper">
        <button class="attach-btn" id="attachBtn" title="Attach">📎</button>
        <input type="file" id="fileInput" style="display:none;" accept="image/*,.pdf,.doc,.docx" />
        <input class="message-input" id="messageInput" placeholder="Message..." />
      </div>
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
  </div>

  <!-- RIGHT: PROFILE PANEL -->
  <div class="info-panel" id="infoPanel">
    <div class="info-header">
      <h3>Contact Info</h3>
    </div>
    <div class="info-content">
      <div class="profile-card">
        <div class="profile-avatar-large" id="profileAvatar">👤</div>
        <div class="profile-name" id="profileName">-</div>
        <div class="profile-handle" id="profileHandle">@username</div>
        <div class="profile-status" id="profileStatus">Offline</div>
      </div>
    </div>
  </div>
</div>

<!-- ADD CONTACT MODAL -->
<div class="modal-overlay" id="addContactModal">
  <div class="modal">
    <h3>🔍 Find Contact</h3>
    <div class="form-group">
      <label class="form-label">Search by username (@)</label>
      <input class="form-input" type="text" id="searchUsername" placeholder="@username" />
    </div>
    <div class="search-results" id="searchResults"></div>
    <div class="modal-actions">
      <button class="cancel" id="closeAddContactBtn">Close</button>
    </div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h3>⚙️ Settings</h3>
    <div class="form-group">
      <label class="form-label">Your Username</label>
      <div style="padding:10px; background:var(--card); border-radius:8px; color:var(--accent); font-weight:600;" id="currentUsername">@username</div>
    </div>
    <div class="form-group">
      <label class="form-label">Full Name</label>
      <input class="form-input" type="text" id="settingsName" placeholder="Full name" />
    </div>
    <div class="form-group">
      <label class="form-label">Status</label>
      <select id="statusSelect" class="form-input">
        <option value="online">🟢 Online</option>
        <option value="away">🟡 Away</option>
        <option value="offline">⚫ Offline</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="cancel" id="closeSettingsBtn">Cancel</button>
      <button class="confirm" id="saveSettingsBtn">Save</button>
    </div>
  </div>
</div>

<script>
  // ===== STATE & STORAGE =====
  const DB_KEY = 'nks_users_db';
  const CHATS_KEY = 'nks_chats_db';
  const CURRENT_USER_KEY = 'nks_current_user';

  let currentUser = null;
  let currentChat = null;
  let allUsers = {};
  let userChats = {};

  // ===== INITIALIZATION =====
  function initializeApp() {
    loadUsers();
    currentUser = getCurrentUser();
    
    if (currentUser) {
      showApp();
      loadChats();
      renderChats();
    } else {
      showLogin();
    }
  }

  function showLogin() {
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('mainContainer').classList.add('hidden');
  }

  function showApp() {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainContainer').classList.remove('hidden');
  }

  // ===== USER MANAGEMENT =====
  function loadUsers() {
    try {
      allUsers = JSON.parse(localStorage.getItem(DB_KEY)) || {};
      if (Object.keys(allUsers).length === 0) {
        allUsers = {
          'demo': {username:'demo', name:'Demo User', password:'demo123', status:'online'},
          'alice': {username:'alice', name:'Alice Johnson', password:'alice123', status:'online'},
          'bob': {username:'bob', name:'Bob Smith', password:'bob123', status:'away'},
          'charlie': {username:'charlie', name:'Charlie Brown', password:'charlie123', status:'offline'}
        };
        saveUsers();
      }
    } catch (e) {
      allUsers = {};
    }
  }

  function saveUsers() {
    localStorage.setItem(DB_KEY, JSON.stringify(allUsers));
  }

  function getCurrentUser() {
    try {
      const data = localStorage.getItem(CURRENT_USER_KEY);
      return data ? JSON.parse(data) : null;
    } catch (e) {
      return null;
    }
  }

  function saveCurrentUser(user) {
    currentUser = user;
    localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(user));
  }

  // ===== CHAT MANAGEMENT =====
  function loadChats() {
    try {
      const key = `${CHATS_KEY}_${currentUser.username}`;
      userChats = JSON.parse(localStorage.getItem(key)) || {};
    } catch (e) {
      userChats = {};
    }
  }

  function saveChats() {
    const key = `${CHATS_KEY}_${currentUser.username}`;
    localStorage.setItem(key, JSON.stringify(userChats));
  }

  function createOrOpenChat(otherUsername) {
    const chatId = [currentUser.username, otherUsername].sort().join('_');
    
    if (!userChats[chatId]) {
      userChats[chatId] = {
        id: chatId,
        otherUser: otherUsername,
        messages: [],
        createdAt: Date.now()
      };
      saveChats();
    }
    
    selectChat(chatId);
  }

  function selectChat(chatId) {
    currentChat = userChats[chatId];
    if (!currentChat) return;

    const otherUsername = currentChat.otherUser;
    const otherUser = allUsers[otherUsername];

    document.getElementById('chatHeader').style.display = 'flex';
    document.getElementById('composerSection').style.display = 'flex';
    document.getElementById('chatName').textContent = otherUser.name;
    document.getElementById('chatStatus').textContent = otherUser.status.charAt(0).toUpperCase() + otherUser.status.slice(1);
    document.getElementById('chatAvatar').textContent = otherUser.name[0].toUpperCase();

    document.getElementById('profileName').textContent = otherUser.name;
    document.getElementById('profileHandle').textContent = '@' + otherUsername;
    document.getElementById('profileStatus').textContent = otherUser.status.charAt(0).toUpperCase() + otherUser.status.slice(1);
    document.getElementById('profileAvatar').textContent = otherUser.name[0].toUpperCase();

    renderMessages();
    renderChats();
    document.getElementById('messageInput').focus();
  }

  // ===== MESSAGE HANDLING =====
  function sendMessage() {
    const text = document.getElementById('messageInput').value.trim();
    if (!text || !currentChat) return;

    const message = {
      id: Date.now(),
      from: currentUser.username,
      text: text,
      timestamp: Date.now(),
      status: 'sent'
    };

    currentChat.messages.push(message);
    saveChats();
    renderMessages();
    document.getElementById('messageInput').value = '';

    setTimeout(() => {
      const reply = {
        id: Date.now() + 1,
        from: currentChat.otherUser,
        text: '👍 Got your message!',
        timestamp: Date.now(),
        status: 'delivered'
      };
      currentChat.messages.push(reply);
      saveChats();
      renderMessages();
    }, 800 + Math.random() * 500);
  }

  function renderMessages() {
    const container = document.getElementById('messagesContainer');
    if (!currentChat || currentChat.messages.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">💬</div><div class="empty-state-text">Start the conversation</div></div>';
      return;
    }

    container.innerHTML = '';
    currentChat.messages.forEach(msg => {
      const isOwn = msg.from === currentUser.username;
      const time = new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      const statusIcon = isOwn ? (msg.status === 'delivered' ? '✓✓' : '✓') : '';

      const msgEl = document.createElement('div');
      msgEl.className = `message ${isOwn ? 'sent' : 'received'}`;
      msgEl.innerHTML = `
        <div class="message-bubble">${msg.text}</div>
        <div class="message-time">${time} ${statusIcon}</div>
      `;
      container.appendChild(msgEl);
    });

    container.scrollTop = container.scrollHeight;
  }

  function renderChats() {
    const container = document.getElementById('contactsList');
    const chats = Object.values(userChats).sort((a, b) => b.createdAt - a.createdAt);

    if (chats.length === 0) {
      container.innerHTML = '<div style="text-align:center; color:var(--muted); padding:20px; font-size:0.9rem;">No chats yet. Start by searching for a user.</div>';
      return;
    }

    container.innerHTML = '';
    chats.forEach(chat => {
      const otherUser = allUsers[chat.otherUser];
      if (!otherUser) return;

      const lastMsg = chat.messages[chat.messages.length - 1];
      const preview = lastMsg ? lastMsg.text.substring(0, 40) : 'No messages';
      const isActive = currentChat && currentChat.id === chat.id;

      const el = document.createElement('div');
      el.className = `contact-item ${isActive ? 'active' : ''}`;
      el.innerHTML = `
        <div class="avatar ${otherUser.status}">${otherUser.name[0].toUpperCase()}</div>
        <div class="contact-info">
          <div class="contact-name">${otherUser.name}</div>
          <div class="contact-handle">@${otherUser.username}</div>
          <div class="contact-preview">${preview}</div>
        </div>
      `;

      el.addEventListener('click', () => selectChat(chat.id));
      container.appendChild(el);
    });
  }

  // ===== AUTH HANDLERS =====
  document.getElementById('loginTabBtn').addEventListener('click', function() {
    this.classList.add('active');
    document.getElementById('signupTabBtn').classList.remove('active');
    document.getElementById('loginForm').style.display = 'flex';
    document.getElementById('signupForm').style.display = 'none';
  });

  document.getElementById('signupTabBtn').addEventListener('click', function() {
    this.classList.add('active');
    document.getElementById('loginTabBtn').classList.remove('active');
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('signupForm').style.display = 'flex';
  });

  document.getElementById('loginBtn').addEventListener('click', () => {
    const username = document.getElementById('loginUsername').value.trim().toLowerCase();
    const password = document.getElementById('loginPassword').value;

    if (!username || !password) {
      alert('Please fill in all fields');
      return;
    }

    const user = allUsers[username];
    if (!user || user.password !== password) {
      alert('Invalid username or password');
      return;
    }

    saveCurrentUser({username: user.username, name: user.name});
    loadChats();
    showApp();
    renderChats();
  });

  document.getElementById('signupBtn').addEventListener('click', () => {
    const username = document.getElementById('signupUsername').value.trim().toLowerCase();
    const name = document.getElementById('signupName').value.trim();
    const password = document.getElementById('signupPassword').value;
    const confirmPassword = document.getElementById('signupConfirmPassword').value;

    if (!username || !name || !password || !confirmPassword) {
      alert('Please fill in all fields');
      return;
    }

    if (password !== confirmPassword) {
      alert('Passwords do not match');
      return;
    }

    if (allUsers[username]) {
      alert('Username already taken');
      return;
    }

    allUsers[username] = {username, name, password, status: 'online'};
    saveUsers();

    alert('Account created! Please login.');
    document.getElementById('loginTabBtn').click();
  });

  // ===== MENU HANDLERS =====
  document.getElementById('menuBtn').addEventListener('click', () => {
    document.getElementById('menuDropdown').classList.toggle('active');
  });

  document.getElementById('newChatMenu').addEventListener('click', () => {
    document.getElementById('menuDropdown').classList.remove('active');
    document.getElementById('searchResults').innerHTML = '';
    document.getElementById('searchUsername').value = '';
    document.getElementById('addContactModal').classList.add('active');
  });

  document.getElementById('settingsMenu').addEventListener('click', () => {
    document.getElementById('menuDropdown').classList.remove('active');
    document.getElementById('currentUsername').textContent = '@' + currentUser.username;
    document.getElementById('settingsName').value = currentUser.name;
    document.getElementById('settingsModal').classList.add('active');
  });

  document.getElementById('logoutMenu').addEventListener('click', () => {
    localStorage.removeItem(CURRENT_USER_KEY);
    currentUser = null;
    currentChat = null;
    document.getElementById('loginUsername').value = '';
    document.getElementById('loginPassword').value = '';
    showLogin();
  });

  // ===== SEARCH & ADD CONTACT =====
  document.getElementById('searchUsername').addEventListener('input', (e) => {
    const query = e.target.value.trim().toLowerCase().replace('@', '');
    const results = document.getElementById('searchResults');

    if (!query) {
      results.innerHTML = '';
      return;
    }

    const matches = Object.values(allUsers).filter(u => 
      u.username.includes(query) && u.username !== currentUser.username
    );

    if (matches.length === 0) {
      results.innerHTML = '<div style="color:var(--muted); padding:10px; text-align:center;">No users found</div>';
      return;
    }

    results.innerHTML = matches.map(u => `
      <div class="search-result-item" onclick="addContact('${u.username}')">
        <div class="search-result-avatar">${u.name[0].toUpperCase()}</div>
        <div class="search-result-info">
          <div class="search-result-name">${u.name}</div>
          <div class="search-result-handle">@${u.username}</div>
        </div>
      </div>
    `).join('');
  });

  window.addContact = function(username) {
    createOrOpenChat(username);
    document.getElementById('addContactModal').classList.remove('active');
  };

  // ===== SETTINGS =====
  document.getElementById('saveSettingsBtn').addEventListener('click', () => {
    const newName = document.getElementById('settingsName').value.trim();
    if (!newName) {
      alert('Please enter a name');
      return;
    }

    currentUser.name = newName;
    allUsers[currentUser.username].name = newName;
    saveCurrentUser(currentUser);
    saveUsers();

    document.getElementById('settingsModal').classList.remove('active');
    renderChats();
    alert('Settings saved!');
  });

  // ===== MESSAGE INPUT =====
  document.getElementById('messageInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  document.getElementById('sendBtn').addEventListener('click', sendMessage);

  // ===== MODAL CLOSE HANDLERS =====
  document.getElementById('closeAddContactBtn').addEventListener('click', () => {
    document.getElementById('addContactModal').classList.remove('active');
  });

  document.getElementById('closeSettingsBtn').addEventListener('click', () => {
    document.getElementById('settingsModal').classList.remove('active');
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.header-actions')) {
      document.getElementById('menuDropdown').classList.remove('active');
    }
  });

  // ===== INIT =====
  initializeApp();
</script>

</body>
</html>
