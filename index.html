<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NKS Messenger</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --accent: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); display: flex; justify-content: center; height: 100vh; }
    .app-container { width: 100%; max-width: 480px; background: var(--bg-secondary); display: flex; flex-direction: column; border-right: 1px solid #334155; border-left: 1px solid #334155; }
    
    header { background: #0f172a; padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    header h1 { font-size: 1.2rem; color: var(--accent); }
    .status-badge { background: #064e3b; color: #34d399; padding: 4px 8px; border-radius: 12px; font-size: 0.75rem; }

    .chat-list { flex: 1; overflow-y: auto; padding: 12px; }
    .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: #334155; margin-bottom: 8px; border-radius: 8px; cursor: pointer; }
    .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .chat-info h4 { font-size: 0.95rem; }
    .chat-info p { font-size: 0.8rem; color: var(--text-muted); word-break: break-word; }

    .controls { padding: 16px; background: #0f172a; border-top: 1px solid #334155; display: flex; flex-direction: column; gap: 10px; }
    input[type="text"] { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #fff; }
    button { padding: 10px; background: var(--accent); border: none; color: #fff; font-weight: bold; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>NKS Messenger</h1>
    <span class="status-badge">🔒 E2E Encrypted</span>
  </header>

  <div class="chat-list" id="chatList" aria-live="polite">
    <div class="chat-item">
      <div class="avatar">NKS</div>
      <div class="chat-info">
        <h4>General Group</h4>
        <p>Welcome to NKS App!</p>
      </div>
    </div>
  </div>

  <div class="controls">
    <input type="text" id="msgInput" placeholder="Type a message..." />
    <button id="sendBtn">Send Message</button>
  </div>
</div>

<script>
  function createChatItem(senderLabel, message, avatarColor) {
    const item = document.createElement('div');
    item.className = 'chat-item';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    if (avatarColor) avatar.style.background = avatarColor;
    avatar.textContent = senderLabel;

    const info = document.createElement('div');
    info.className = 'chat-info';
    const title = document.createElement('h4');
    title.textContent = senderLabel === 'You' ? 'Sent Message' : senderLabel;
    const p = document.createElement('p');
    // Use textContent to avoid inserting HTML (prevents XSS)
    p.textContent = message;

    info.appendChild(title);
    info.appendChild(p);

    item.appendChild(avatar);
    item.appendChild(info);
    return item;
  }

  function sendMessage() {
    const input = document.getElementById('msgInput');
    const val = input.value.trim();
    if (!val) return;

    const chatList = document.getElementById('chatList');
    const newItem = createChatItem('You', val, '#3b82f6');
    chatList.appendChild(newItem);
    input.value = '';
    chatList.scrollTop = chatList.scrollHeight;
    input.focus();
  }

  document.getElementById('sendBtn').addEventListener('click', sendMessage);
  document.getElementById('msgInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') sendMessage();
  });
</script>

</body>
</html>
