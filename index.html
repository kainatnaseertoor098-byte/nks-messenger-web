<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NKS Messenger (Serverless)</title>
  <!-- PeerJS Library for P2P connection without backend server -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-main: #111b21; --bg-side: #111b21; --bg-header: #202c33;
      --bg-chat: #0b141a; --accent: #00a884; --text: #e9edef;
      --text-muted: #8696a0; --msg-sent: #005c4b; --msg-recv: #202c33;
      --border: #222d34; --icon-color: #aebac1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg-main); color: var(--text); }
    svg.icon { width: 22px !important; height: 22px !important; stroke: var(--icon-color) !important; stroke-width: 2 !important; fill: none !important; stroke-linecap: round; stroke-linejoin: round; cursor: pointer; flex-shrink: 0; }

    .auth-screen { position: fixed; inset: 0; background: var(--bg-main); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-screen.hidden { display: none; }
    .auth-card { background: var(--bg-header); border-radius: 16px; padding: 24px; width: 100%; max-width: 360px; border: 1px solid var(--border); text-align: center; }
    .auth-title { font-size: 1.4rem; margin-bottom: 16px; font-weight: 700; color: #fff; }
    .auth-input { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-main); color: var(--text); font-size: 1rem; outline: none; margin-bottom: 12px; }
    .auth-btn { width: 100%; padding: 14px; border-radius: 8px; border: none; background: var(--accent); color: #111; font-weight: 700; font-size: 1rem; cursor: pointer; }

    .app-root { display: flex; width: 100%; height: 100vh; position: relative; overflow: hidden; }
    .app-root.hidden { display: none; }

    .sidebar { width: 35%; min-width: 300px; height: 100%; display: flex; flex-direction: column; background: var(--bg-side); border-right: 1px solid var(--border); transition: transform 0.25s ease; }
    .top-header { height: 60px; background: var(--bg-header); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--border); }
    .brand-title { font-size: 1.2rem; font-weight: 700; color: #fff; }
    .chat-list { flex: 1; overflow-y: auto; padding: 12px; }

    .chat-panel { flex: 1; height: 100%; display: flex; flex-direction: column; background: var(--bg-chat); transition: transform 0.25s ease; }
    .active-chat-header { height: 60px; background: var(--bg-header); display: flex; align-items: center; padding: 0 12px; gap: 10px; border-bottom: 1px solid var(--border); }
    .chat-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg-bubble { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; word-break: break-word; }
    .msg-bubble.sent { align-self: flex-end; background: var(--msg-sent); border-bottom-right-radius: 2px; }
    .msg-bubble.received { align-self: flex-start; background: var(--msg-recv); border-bottom-left-radius: 2px; }
    .msg-footer { font-size: 0.65rem; color: rgba(255,255,255,0.6); text-align: right; margin-top: 4px; }
    .chat-input-bar { height: 62px; background: var(--bg-header); display: flex; align-items: center; padding: 0 12px; gap: 8px; }
    .message-input { flex: 1; background: var(--bg-main); border: none; padding: 12px 16px; border-radius: 24px; color: var(--text); outline: none; font-size: 0.95rem; }
    .back-btn { display: none; align-items: center; justify-content: center; padding: 4px; }

    @media (max-width: 768px) {
      .sidebar { width: 100%; min-width: 100%; position: absolute; inset: 0; z-index: 10; }
      .chat-panel { width: 100%; position: absolute; inset: 0; z-index: 20; transform: translateX(100%); }
      .app-root.mobile-chat-active .chat-panel { transform: translateX(0); }
      .back-btn { display: flex; }
    }
  </style>
</head>
<body>

<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <h2 class="auth-title">NKS Messenger</h2>
    <input class="auth-input" type="text" id="usernameInput" placeholder="Enter Your Username..." />
    <button class="auth-btn" id="loginBtn">Start Session</button>
  </div>
</div>

<div class="app-root hidden" id="appRoot">
  <div class="sidebar">
    <div class="top-header">
      <span class="brand-title">NKS Messenger</span>
      <svg class="icon" id="logoutBtn" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
    </div>
    <div style="padding: 12px 16px; border-bottom: 1px solid var(--border);">
      <input class="auth-input" style="margin-bottom:8px;" type="text" id="connectPeerInput" placeholder="Connect to Peer ID..." />
      <button class="auth-btn" style="padding: 8px;" id="connectBtn">Connect User</button>
    </div>
    <div class="chat-list" id="userList"></div>
  </div>

  <div class="chat-panel">
    <div class="active-chat-header">
      <div class="back-btn" id="backBtn">
        <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </div>
      <div class="user-avatar">
        <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </div>
      <div>
        <div style="font-weight:600;" id="activeTitle">Select or Connect Contact</div>
        <div style="font-size:0.75rem; color:var(--accent);" id="activeStatus">Disconnected</div>
      </div>
    </div>

    <div class="chat-body" id="chatBody"></div>

    <div class="chat-input-bar">
      <input class="message-input" type="text" id="msgInput" placeholder="Type a message..." />
      <svg class="icon" id="sendBtn" viewBox="0 0 24 24" style="transform: rotate(45deg); stroke: var(--accent) !important;"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </div>
  </div>
</div>

<script>
  let peer = null;
  let activeConn = null;
  let currentUser = null;
  const connections = {};
  const chatStore = {};

  const authScreen = document.getElementById('authScreen');
  const appRoot = document.getElementById('appRoot');
  const chatBody = document.getElementById('chatBody');
  const msgInput = document.getElementById('msgInput');

  document.getElementById('loginBtn').onclick = () => {
    const val = document.getElementById('usernameInput').value.trim();
    if (!val) return;
    currentUser = val;

    // Initialize free peer instance using PeerJS Cloud
    peer = new Peer(currentUser);

    peer.on('open', (id) => {
      authScreen.classList.add('hidden');
      appRoot.classList.remove('hidden');
    });

    peer.on('connection', (conn) => {
      setupConnection(conn);
    });

    peer.on('error', (err) => {
      alert("Peer Error: " + err.type + ". Try a different username.");
    });
  };

  document.getElementById('connectBtn').onclick = () => {
    const targetPeer = document.getElementById('connectPeerInput').value.trim();
    if (!targetPeer || targetPeer === currentUser) return;

    const conn = peer.connect(targetPeer);
    setupConnection(conn);
  };

  function setupConnection(conn) {
    conn.on('open', () => {
      connections[conn.peer] = conn;
      activeConn = conn;
      document.getElementById('activeTitle').innerText = conn.peer;
      document.getElementById('activeStatus').innerText = "Connected";
      appRoot.classList.add('mobile-chat-active');
      renderMessages();
    });

    conn.on('data', (data) => {
      if (!chatStore[conn.peer]) chatStore[conn.peer] = [];
      chatStore[conn.peer].push(data);
      if (activeConn && activeConn.peer === conn.peer) renderMessages();
    });

    conn.on('close', () => {
      delete connections[conn.peer];
      if (activeConn && activeConn.peer === conn.peer) {
        document.getElementById('activeStatus').innerText = "Disconnected";
      }
    });
  }

  function renderMessages() {
    chatBody.innerHTML = '';
    if (!activeConn || !chatStore[activeConn.peer]) return;

    chatStore[activeConn.peer].forEach(msg => {
      const isSent = msg.from === currentUser;
      const bubble = document.createElement('div');
      bubble.className = `msg-bubble ${isSent ? 'sent' : 'received'}`;
      bubble.innerHTML = `${msg.text}<div class="msg-footer">${msg.time}</div>`;
      chatBody.appendChild(bubble);
    });
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || !activeConn) return;

    const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const msgObj = { from: currentUser, text, time: timeStr };

    if (!chatStore[activeConn.peer]) chatStore[activeConn.peer] = [];
    chatStore[activeConn.peer].push(msgObj);

    activeConn.send(msgObj);
    msgInput.value = '';
    renderMessages();
  }

  document.getElementById('sendBtn').onclick = sendMessage;
  msgInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
  document.getElementById('backBtn').onclick = () => appRoot.classList.remove('mobile-chat-active');
  document.getElementById('logoutBtn').onclick = () => location.reload();
</script>
</body>
</html>
